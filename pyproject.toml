[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "visionguard-ai-image-detector"
version = "0.1.0"
description = "Reproducible AI-generated versus real image classification with an end-to-end MLOps workflow."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Rao Haris" }]
dependencies = [
  "dagshub>=0.6,<1",
  "dvc[s3]>=3.60,<4",
  "flask>=3.1,<4",
  "gunicorn>=23,<24",
  "keras-tuner>=1.4,<2",
  "matplotlib>=3.10,<4",
  "mlflow>=3.5,<4",
  "numpy>=2.1,<2.3",
  "pandas>=2.2,<3",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6.0,<7",
  "requests>=2.32,<3",
  "scikit-learn>=1.6,<2",
  "seaborn>=0.13,<1",
  "sqlalchemy>=2.0,<3",
  "tensorflow-cpu==2.21.0",
  "waitress>=3.0,<4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
visionguard-audit = "visionguard.data.audit:main"
visionguard-train = "visionguard.models.train:main"
visionguard-web = "visionguard.web.app:main"
visionguard-api = "visionguard.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/visionguard"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
markers = ["integration: requires heavyweight services or a trained model"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
