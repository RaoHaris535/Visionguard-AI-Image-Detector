steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - Dockerfile.api
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/visionguard-api:$COMMIT_SHA
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/visionguard-api:$COMMIT_SHA
substitutions:
  _REGION: asia-south1
  _REPOSITORY: visionguard
